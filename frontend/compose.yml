services:
  umssy-app:
    build:
      context: .
      dockerfile: Dockerfile  
      args:
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
        NEXT_PUBLIC_API_URL_LOCAL: ${NEXT_PUBLIC_API_URL_LOCAL}
        NEXT_PUBLIC_API_URL_DEV: ${NEXT_PUBLIC_API_URL_DEV}
        NEXT_PUBLIC_API_URL_PROD: ${NEXT_PUBLIC_API_URL_PROD}
        NEXT_PUBLIC_STANDALONE_EPIC4: ${NEXT_PUBLIC_STANDALONE_EPIC4}
        NEXT_PUBLIC_DEMO_COMPANY_ID: ${NEXT_PUBLIC_DEMO_COMPANY_ID}
        NEXT_PUBLIC_DEMO_COMPANY_NAME: ${NEXT_PUBLIC_DEMO_COMPANY_NAME}
    container_name: umssy-app
    ports:
      - "${FRONTEND_PORT}:3000"
    restart: unless-stopped
